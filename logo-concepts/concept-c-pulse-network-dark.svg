<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="DispatchFlow">
  <rect x="4" y="8" width="48" height="48" rx="14" fill="#0B1220"/>
  <!-- Network nodes: left, center-top, right-bottom = request → track → deliver -->
  <circle cx="16" cy="32" r="4" fill="white" opacity="0.9"/>
  <circle cx="28" cy="18" r="4" fill="#A3E635"/>
  <circle cx="40" cy="36" r="4.5" fill="white"/>
  <circle cx="40" cy="36" r="2" fill="#0B1220"/>
  <!-- Connectors -->
  <path d="M19.5 29.5 L24.5 21.5" stroke="#A3E635" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M31.5 21 L37 32.5" stroke="#A3E635" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Subtle base arc suggesting continuous flow -->
  <path d="M16 36 C22 44, 34 44, 40 40" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.35" fill="none"/>
  <text x="68" y="39" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.02em" fill="#FFFFFF">Dispatch</text>
  <text x="185" y="39" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.02em" fill="#A3E635">Flow</text>
</svg>